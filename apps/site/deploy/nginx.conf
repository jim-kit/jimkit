# Serves the static export (apps/site/out). Pages are directories with an index.html (trailingSlash), so /docs/install/ is a folder.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # headers on every answer. Not "includeSubDomains" on the HSTS line: the parent domain has other sites on it.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;   # the home page frames its own /frame/
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
  add_header Strict-Transport-Security "max-age=31536000" always;

  # pages: revalidate, so a new deploy shows at once; the hashed files they point at never change
  location / {
    try_files $uri $uri/index.html $uri.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }
  # ^~ so the image rule below (a regular expression) cannot take the hashed files in here
  location ^~ /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location ~* \.(png|svg|ico|webp)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  error_page 404 /404.html;
}
